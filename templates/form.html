<!-- templates/form.html -->
{% extends "base.html" %}

{% block content %}
<h2 class="text-center mb-4">Scholarship Eligibility Form</h2>
<form action="{{ url_for('scholarship_form') }}" method="post" class="card p-4 shadow-sm">
    <div class="form-group">
        <label for="program" class="form-label">Program Interested:</label>
        <select class="form-control" name="program" id="program" required>
            <option value="" disabled selected>Select your program</option>
            <option value="BHM">BHM</option>
            <option value="BIM">BIM</option>
        </select>
    </div>
    <div class="form-group">
        <label for="cmat_score" class="form-label">CMAT Score:</label>
        <input type="number" class="form-control" name="cmat_score" id="cmat_score" min="0" max="100"
               required>
    </div>
    <div class="form-group">
        <label for="gpa" class="form-label">High School GPA:</label>
        <input type="number" class="form-control" name="gpa" id="gpa" step="0.01" min="1" max="4"
               required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Check Scholarship</button>
</form>
{% endblock %}
